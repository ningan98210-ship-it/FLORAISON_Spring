<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLORAISON 花信 春季號</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@300;400;500&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: a physical two-page magazine on a dark table; each look = full-bleed spread + square/colour-card spread */
  --stage:#191817;
  --stage-2:#2a2826;
  --paper:#F6F4EF;
  --ink:#151413;
  --mute:#8a857d;
  --hair:#d9d4cb;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --cjk:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --label:"Jost","Futura","Helvetica Neue",Arial,sans-serif;
  --pw:480px; --ph:640px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--stage);color:#eee;overflow:hidden}
body{font-family:var(--label);background:radial-gradient(ellipse at 50% 40%,var(--stage-2),var(--stage) 70%)}
#stage{position:absolute;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center;perspective:2600px}
#book{position:relative;cursor:pointer;width:calc(var(--pw)*2);height:var(--ph);transition:transform .9s cubic-bezier(.45,.05,.2,1);perspective:2600px}
.leaf{position:absolute;top:0;left:var(--pw);width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.2,1)}
.leaf.turned{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
#book.single{width:var(--pw)}
.spage{position:absolute;inset:0;transform-origin:left center;transition:transform .7s cubic-bezier(.45,.05,.2,1),opacity .7s ease;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.spage.gone{transform:rotateY(-105deg);opacity:0}
.spage.far{visibility:hidden}
#book:not(.single){filter:drop-shadow(0 26px 40px rgba(0,0,0,.5))}

/* ---------- page base ---------- */
.page{position:absolute;inset:0;background:var(--paper);color:var(--ink);font-size:calc(var(--pw)/40);overflow:hidden}
.single .page{font-size:calc(var(--pw)/34)}
.page.L::after,.page.R::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none;z-index:5}
.page.L::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.22),rgba(0,0,0,0))}
.page.R::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.18),rgba(255,255,255,0) 60%)}
.single .page::after{display:none}
.lab{font-family:var(--label);font-weight:400;font-size:.62em;letter-spacing:.22em;text-transform:uppercase}
.cj{font-family:var(--cjk)}
.folio{position:absolute;bottom:2.4em;font-family:var(--label);font-size:.6em;letter-spacing:.2em;color:var(--mute)}
.L .folio{left:3.2em}.R .folio,.single .folio{right:3.2em}
img{display:block}

/* wide spread */
.wide{background:#000}
.wide .half{position:absolute;inset:0;overflow:hidden}
.wide .half img{position:absolute;top:0;height:100%;width:200%;object-fit:cover}
.wide.L .half img{left:0}
.wide.R .half img{left:-100%}
.wide.full .half img{width:100%;left:0;object-position:50% 50%}
.ov{position:absolute;z-index:6;color:#fff;text-shadow:0 0 1.2em rgba(0,0,0,.35)}
.bignum{left:6%;bottom:4%;font-family:var(--display);font-weight:400;font-size:9em;line-height:.8;letter-spacing:-.02em}
.wide.full .bignum{font-size:7em}
.wcap{right:7%;bottom:6%;text-align:right}
.wcap .fe{font-family:var(--display);font-style:italic;font-size:1.6em;display:block}
.wcap .fc{font-family:var(--cjk);font-size:1em;letter-spacing:.4em;display:block;margin-top:.3em}
.wtag{left:6%;top:5%}
.wide.R .wtag{left:auto;right:7%;top:5%}

/* square page */
.sq{display:flex;flex-direction:column;align-items:center}
.sq .frame{margin-top:11%;width:78%;aspect-ratio:1;overflow:hidden;box-shadow:0 1.2em 2.6em rgba(0,0,0,.25)}
.sq .frame img{width:100%;height:100%;object-fit:cover}
.sq .row{width:78%;display:flex;justify-content:space-between;align-items:baseline;margin-top:1.6em}
.sq .sqname{width:78%;margin-top:1.2em;display:flex;align-items:baseline;gap:.8em}
.sq .sqname .fe{font-family:var(--display);font-style:italic;font-size:2.6em;line-height:1}
.sq .sqname .fc{font-family:var(--cjk);font-size:1.1em;letter-spacing:.3em}
.sq .dots{width:78%;display:flex;gap:.5em;margin-top:auto;margin-bottom:5.2em}
.sq .dots i{width:1.1em;height:1.1em;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.35)}

/* info page */
.info{padding:3.4em 3.4em 4.4em 4em;display:flex;flex-direction:column}
.info .top{display:flex;justify-content:space-between;color:var(--mute)}
.info h2{font-family:var(--display);font-weight:500;line-height:.92;margin-top:.55em;letter-spacing:-.01em;text-wrap:balance}
.info .cn{font-family:var(--cjk);font-weight:600;font-size:1.5em;letter-spacing:.5em;margin-top:.5em}
.info .ed{display:inline-block;margin-top:1em;padding:.45em .9em;border:1px solid var(--ink);align-self:flex-start}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:.7em;margin-top:2em}
.chip .sw{aspect-ratio:3/4;width:100%}
.chip .c1{font-family:var(--cjk);font-size:.86em;margin-top:.6em;font-weight:600}
.chip .c2{font-size:.5em;letter-spacing:.14em;text-transform:uppercase;margin-top:.35em;line-height:1.35}
.chip .c3{font-size:.52em;letter-spacing:.08em;color:var(--mute);margin-top:.3em;font-variant-numeric:tabular-nums}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1.5em 2em;margin-top:auto;border-top:1px solid var(--hair);padding-top:1.4em}
.spec h4{font-weight:400;color:var(--mute);margin-bottom:.7em}
.spec p{font-size:.84em;line-height:1.75;display:flex;gap:.7em;align-items:baseline}
.spec p b{font-family:var(--cjk);font-weight:600;min-width:4.6em}
.spec p span{font-size:.72em;letter-spacing:.16em;text-transform:uppercase}
.spec .model{font-family:var(--cjk);font-size:1.7em;font-weight:600;line-height:1.2}

/* cover */
.cover{background:#111;color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cover::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0) 42%),linear-gradient(to bottom,rgba(0,0,0,.28),rgba(0,0,0,0) 22%)}
.cover .mast{position:absolute;top:4.5%;left:0;right:0;text-align:center;z-index:2}
.cover .mast b{display:block;font-family:var(--display);font-weight:500;font-size:6.2em;letter-spacing:.04em;line-height:.9;text-shadow:0 0 1em rgba(0,0,0,.2)}
.cover .mast span{display:block;margin-top:.6em}
.cover .lines{position:absolute;left:6%;bottom:6%;z-index:2;text-shadow:0 0 1em rgba(0,0,0,.45)}
.cover .lines .big{font-family:var(--display);font-style:italic;font-size:2.4em;line-height:1.05}
.cover .lines .cj{font-size:1.15em;letter-spacing:.4em;margin:.5em 0 1.2em}
.cover .side{position:absolute;right:6%;bottom:6%;z-index:2;text-align:right;text-shadow:0 0 1em rgba(0,0,0,.5);display:flex;flex-direction:column;gap:1.1em}
.cover .side div{font-family:var(--display);font-size:1.15em;line-height:1.1}
.cover .side small{display:block;font-family:var(--cjk);font-size:.72em;letter-spacing:.3em;margin-top:.2em}

/* masthead / contents / end pages */
.txt{padding:4em 3.6em 4.4em 4em;display:flex;flex-direction:column}
.txt h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:4.4em;line-height:.95}
.txt .sub{font-family:var(--cjk);letter-spacing:.6em;font-size:1.2em;margin-top:.5em}
.cred{margin-top:2.6em;display:grid;gap:1.5em}
.cred h4{font-weight:400;color:var(--mute);margin-bottom:.35em}
.cred .nm{font-family:var(--cjk);font-size:1.6em;font-weight:600}
.note{margin-top:auto;position:relative;display:grid;gap:.05em}
.note .nb{position:absolute;right:-5.5em;bottom:-3.5em;width:15em;height:15em;pointer-events:none;opacity:.95}
.note h4{position:relative}
.note p{position:relative;font-family:var(--display);font-weight:400;font-size:2.7em;line-height:1.02;letter-spacing:-.01em}
.note p em{font-style:italic}
.note p:nth-of-type(2){padding-left:1.1em}
.note p:nth-of-type(3){padding-left:2.2em}
.note .spring{font-style:italic;background:linear-gradient(90deg,#e8a0b0,#e7c64b 50%,#8fb46a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}
.single .note p{font-size:2.1em}.single .cred{gap:.8em;margin-top:1.4em}.single .note .nb{width:11em;height:11em;right:-4em;bottom:-2.5em}
.toc.tight a{padding:.2em 0;font-size:.92em}
.single .toc.tight a{padding:.12em 0;font-size:.86em}
.note .sig{position:relative;display:flex;gap:1.6em;margin-top:1.1em;color:var(--mute)}
.strip{display:flex;height:1em;margin-top:2em}
.strip i{flex:1}
.toc{margin-top:1.6em;display:flex;flex-direction:column}
.toc a{display:grid;grid-template-columns:2.6em 1fr auto;align-items:baseline;gap:.6em;padding:.42em 0;border-bottom:1px solid var(--hair);color:inherit;text-decoration:none;cursor:pointer}
.toc a:hover .tn,.toc a:focus-visible .tn{font-style:italic}
.toc a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.toc .no{font-family:var(--display);font-size:1em;font-variant-numeric:tabular-nums}
.toc .tn{font-family:var(--display);font-size:.98em}
.toc .tn small{font-family:var(--cjk);font-size:.82em;margin-left:.6em;letter-spacing:.15em}
.toc .md{font-family:var(--cjk);font-size:.8em;color:var(--mute)}
.pal{margin-top:1.2em;display:grid;grid-template-columns:2em repeat(5,1fr);gap:.28em .35em;align-items:center}
.pal .no{font-family:var(--display);font-size:.8em}
.pal i{height:1.12em;display:block;transition:transform .3s}
.pal i:hover{transform:scaleY(1.5)}
.bcover{background:#121212;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bcover b{font-family:var(--display);font-weight:500;font-size:3.6em;letter-spacing:.04em}
.bcover .dots{display:grid;grid-template-columns:repeat(6,1.4em);gap:.7em;margin:2.4em 0}
.bcover .dots i{width:1.4em;height:1.4em;border-radius:50%}
.bar{position:absolute;bottom:4em;right:4em;background:#fff;padding:.7em .8em .4em;color:#111}
.bar .bars{display:flex;height:3em;align-items:stretch;gap:0}
.bar .bars i{display:block;background:#111}
.bar .num{font-size:.6em;letter-spacing:.24em;margin-top:.3em;font-variant-numeric:tabular-nums}

/* controls */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:22px;font-family:var(--label);color:#cfc9bf}
#ctrl button{background:none;border:1px solid #57524b;color:#e9e4da;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
#ctrl button:hover{border-color:#e9e4da}
#ctrl button:focus-visible{outline:2px solid #e9e4da;outline-offset:2px}
#ctrl button:disabled{opacity:.3;cursor:default}
#pg{min-width:120px;text-align:center;font-size:12px;letter-spacing:.24em;font-variant-numeric:tabular-nums}
.hit{position:absolute;top:0;bottom:0;width:50%;z-index:50;cursor:pointer}
.hit.l{left:0}.hit.r{right:0}

.mgrid{margin-top:1.3em;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(10,auto);column-gap:1.2em;row-gap:.25em}
.mgrid a{position:relative;display:grid;grid-template-columns:.35em 1.9em 1fr auto;align-items:center;gap:.45em;padding:.22em .4em .22em 0;line-height:1.15;color:inherit;text-decoration:none;cursor:pointer;overflow:hidden}
.mgrid a::before{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.3,.1,.2,1)}
.mgrid a > *{position:relative}
.mgrid a:hover::before,.mgrid a:focus-visible::before{transform:scaleX(1)}
.mgrid a:hover,.mgrid a:focus-visible{color:var(--fg)}
.mgrid .rb{align-self:stretch;display:block;background:var(--c)}
.mgrid .no{font-family:var(--display);font-size:.9em;font-variant-numeric:tabular-nums}
.mgrid .nm{font-family:var(--cjk);font-weight:600;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid .fl{font-family:var(--cjk);font-size:.68em;opacity:.7;white-space:nowrap}
.toc a,.toc a *{line-height:1.15}

/* colourful contents */
.toc.tight{gap:.18em;border:0}
.toc.tight a{position:relative;grid-template-columns:.42em 2.2em 1fr auto auto;align-items:center;border-bottom:0;padding:.18em .5em .18em 0;overflow:hidden}
.toc.tight a::before{content:"";position:absolute;inset:0;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.3,.1,.2,1)}
.toc.tight a > *{position:relative}
.toc.tight a:hover::before,.toc.tight a:focus-visible::before{transform:scaleX(1)}
.toc.tight a:hover,.toc.tight a:focus-visible{color:var(--fg)}
.toc.tight a:hover .md,.toc.tight a:focus-visible .md{color:inherit}
.toc.tight .rb{align-self:stretch;display:block;background:var(--c);transform-origin:left}
.toc.tight .no{padding-left:.5em}
.toc.tight .pd{display:flex;gap:.18em}
.toc.tight .pd i{width:.5em;height:.5em;border-radius:50%;transition:transform .3s}
.toc.tight a:hover .pd i{transform:scale(1.35);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.toc.tight.play a{animation:rowIn .6s cubic-bezier(.3,.1,.2,1) both;animation-delay:calc(var(--i) * 38ms + 250ms)}
.toc.tight.play .rb{animation:barIn .7s cubic-bezier(.3,.1,.2,1) both;animation-delay:calc(var(--i) * 38ms + 250ms)}
@keyframes rowIn{from{transform:translateX(-.6em);opacity:.35}to{transform:none;opacity:1}}
@keyframes barIn{0%{transform:scaleX(0)}60%{transform:scaleX(2.4)}100%{transform:scaleX(1)}}
.looksT{background:linear-gradient(90deg,var(--grad));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 14s linear infinite;padding-right:.1em}
@keyframes flow{from{background-position:0% 50%}to{background-position:300% 50%}}
@media (prefers-reduced-motion:reduce){.looksT{animation:none}.toc.tight.play a,.toc.tight.play .rb{animation:none}}
@media (prefers-reduced-motion:reduce){#book,.leaf,.spage{transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="book"></div></div>
<div id="ctrl">
  <button id="prev" aria-label="上一頁">‹</button>
  <div id="pg">1 / 1</div>
  <button id="next" aria-label="下一頁">›</button>
</div>

function tocPage(side){
  const grad=LOOKS.map(l=>l.colors[0].hex).concat([LOOKS[0].colors[0].hex]).join(',');
  return P('txt '+side,`<div class="lab" style="color:var(--mute)">Contents 目錄</div>
  <h1 style="font-size:2.8em;margin-top:.3em"><span class="looksT" style="--grad:${grad}">Looks</span></h1>
  <div class="toc tight">${LOOKS.map((l,i)=>{const c=l.colors[0].hex;return `<a data-go="${l.n}" tabindex="0" style="--c:${c};--fg:${onBg(c)};--i:${i}"><i class="rb"></i><span class="no">${pad(l.n)}</span><span class="tn">${l.fe.charAt(0)+l.fe.slice(1).toLowerCase()}<small>${l.fc}</small></span><span class="pd">${l.colors.slice(1).map(x=>`<i style="background:${x.hex}"></i>`).join('')}</span><span class="md">${l.model}${l.n===16?' · 主編':''}</span></a>`}).join('')}</div>`);
}
function wideHalf(l,side,full){
  const cap=`<div class="ov wcap"><span class="fe">${l.fe.charAt(0)+l.fe.slice(1).toLowerCase()}</span><span class="fc">${l.fc}</span></div>`;
  const num=`<div class="ov bignum">${pad(l.n)}</div>`;
  const tag=`<div class="ov wtag lab">Look ${pad(l.n)} · ${l.model}</div>`;
  let inner=`<div class="half">${I(img(l.n,'wide'))}</div>`;
  if(full) inner+=num+cap+tag; else if(side==='L') inner+=num+tag; else inner+=cap+`<div class="ov wtag lab">Floraison SS27</div>`;
  return P(`wide ${full?'full':side}`,inner);
}
function sqPage(l,side,pno){
  const bg=l.colors[0].hex, fg=onBg(bg);
  return P(`sq ${side}`,`<div class="frame">${I(img(l.n,'sq'))}</div>
  <div class="row lab"><span>Look ${pad(l.n)}</span><span>${l.model}</span></div>
  <div class="sqname"><span class="fe">${l.fe.charAt(0)+l.fe.slice(1).toLowerCase()}</span><span class="fc">${l.fc}</span></div>
  <div class="dots">${l.colors.map(c=>`<i style="background:${c.hex}"></i>`).join('')}</div>
  ${pno?`<div class="folio" style="color:${fg};opacity:.7">${pno}</div>`:''}`,`style="background:${bg};color:${fg}"`);
}
function infoPage(l,side,pno){
  const sp=(t,arr)=>`<div class="spec"><h4 class="lab">${t}</h4>${arr.map(([c,e])=>`<p><b>${c}</b><span>${e}</span></p>`).join('')}</div>`;
  return P(`info ${side}`,`<div class="top lab"><span>Look ${pad(l.n)} / ${pad(N)}</span><span>Floraison SS27</span></div>
  <h2 style="font-size:${feSize(l.fe)}em">${l.fe}</h2>
  <div class="cn">${l.fc}</div>
  ${l.n===16?`<div class="ed lab">Editor's Look 主編造型</div>`:''}
  <div class="chips">${l.colors.map(c=>`<div class="chip"><div class="sw" style="background:${c.hex}"></div><div class="c1">${c.cn}</div><div class="c2">${c.en}</div><div class="c3">${c.hex}</div></div>`).join('')}</div>
  <div class="specs">
    ${sp('Material 材質',l.material)}
    ${sp('Motif 意象',l.motif)}
    ${sp('Mood 情緒',l.mood)}
    <div class="spec"><h4 class="lab">Model 模特</h4><div class="model">${l.model}</div></div>
  </div>
  ${pno?`<div class="folio">${pno}</div>`:''}`);
}
function palPage(side,pno){
  return P('txt '+side,`<div class="lab" style="color:var(--mute)">Index 索引</div>
  <h1 style="font-size:2.8em;margin-top:.3em">The <span class="looksT" style="--grad:${LOOKS.map(l=>l.colors[0].hex).join(',')}">Palette</span></h1><div class="sub" style="font-size:1em">春季色譜</div>
  <div class="pal">${LOOKS.map(l=>`<span class="no">${pad(l.n)}</span>${l.colors.map(c=>`<i style="background:${c.hex}" title="${c.cn} ${c.en}"></i>`).join('')}`).join('')}</div>
  ${pno?`<div class="folio">${pno}</div>`:''}`);
}
function credPage(side,pno){
  return P('txt '+side,`<div class="lab" style="color:var(--mute)">Credits 製作</div>
  <h1 style="font-size:2.8em;margin-top:.3em"><span class="looksT" style="--grad:${LOOKS.map(l=>l.colors[0].hex).join(',')}">Models</span></h1><div class="sub" style="font-size:1em">模特</div>
  <div class="mgrid">${LOOKS.map(l=>{const c=l.colors[0].hex;return `<a data-go="${l.n}" tabindex="0" style="--c:${c};--fg:${onBg(c)}"><i class="rb"></i><span class="no">${pad(l.n)}</span><span class="nm">${l.model}</span><span class="fl">${l.fc}</span></a>`}).join('')}</div>
  <div class="cred" style="margin-top:auto;padding-top:1em;grid-template-columns:1fr 1fr">
    <div><h4 class="lab">Editor-in-Chief 總編輯</h4><div class="nm" style="font-size:1.2em">寧安</div></div>
    <div><h4 class="lab">Project 企劃</h4><div class="nm" style="font-size:1.2em;font-family:var(--display);font-style:italic;font-weight:400">Petal to Petal Spring</div></div>
  </div>
  ${pno?`<div class="folio">${pno}</div>`:''}`);
}
function backPage(side){
  let seed=11,bars='';for(let i=0;i<46;i++){seed=(seed*9301+49297)%233280;const w=1+Math.floor(seed/233280*3);bars+=`<i style="width:${w*.12}em;margin-right:${(1+(seed%3))*.1}em"></i>`}
  return P('bcover '+side,`<div class="lab" style="opacity:.6">Spring / Summer 2027</div><b>FLORAISON</b><div class="cj" style="letter-spacing:.6em;margin-top:.4em">花信</div>
  <div class="dots">${LOOKS.map(l=>`<i style="background:${l.colors[0].hex}"></i>`).join('')}</div>
  <div class="lab" style="opacity:.6">Issue 01 · 20 Looks</div>
  <div class="bar"><div class="bars">${bars}</div><div class="num">2027 0101 0020</div></div>`);
}

let mode=null, pages=[], cur=0, busy=false;
const book=document.getElementById('book');

function buildPages(m){
  const out=[];
  if(m==='spread'){
    out.push(coverPage());
    out.push(mastPage('L'));out.push(tocPage('R'));
    let p=4;
    LOOKS.forEach(l=>{out.push(wideHalf(l,'L'));out.push(wideHalf(l,'R'));out.push(sqPage(l,'L',p+2));out.push(infoPage(l,'R',p+3));p+=4;});
    out.push(palPage('L',p));out.push(credPage('R',p+1));out.push(backPage('L'));
  }else{
    out.push(coverPage());out.push(mastPage(''));out.push(tocPage(''));
    LOOKS.forEach(l=>{out.push(wideHalf(l,'',true));out.push(sqPage(l,'',0));out.push(infoPage(l,'',0));});
    out.push(palPage('',0));out.push(credPage('',0));out.push(backPage(''));
  }
  return out;
}
function lookStart(n){return mode==='spread'?(4+4*(n-1))/2:3+3*(n-1)}
function render(){
  book.innerHTML='';
  if(mode==='spread'){
    book.classList.remove('single');
    const nl=pages.length/2;
    for(let i=0;i<nl;i++){
      const lf=document.createElement('div');lf.className='leaf';
      lf.innerHTML=`<div class="face front">${pages[2*i]}</div><div class="face back">${pages[2*i+1]}</div>`;
      book.appendChild(lf);
    }
  }else{
    book.classList.add('single');
    pages.forEach((h,j)=>{const d=document.createElement('div');d.className='spage';d.innerHTML=h;book.appendChild(d);});
  }
  book.querySelectorAll('[data-go]').forEach(a=>{
    const go=e=>{e.stopPropagation();jump(lookStart(+a.dataset.go))};
    a.addEventListener('click',go);a.addEventListener('keydown',e=>{if(e.key==='Enter')go(e)});
  });
  layout(true);
}
function maxPos(){return mode==='spread'?pages.length/2:pages.length-1}
function layout(instant,flipIdx){
  const els=[...book.children].filter(e=>e.classList.contains('leaf')||e.classList.contains('spage'));
  if(instant)els.forEach(e=>e.style.transition='none');
  if(mode==='spread'){
    const nl=els.length;
    els.forEach((lf,i)=>{const t=i<cur;lf.classList.toggle('turned',t);lf.style.zIndex=i===flipIdx?999:(t?i+1:nl-i)});
    const pw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'));
    book.style.transform=`translateX(${cur===0?-pw/2:cur===nl?pw/2:0}px)`;
    hydrate(els,i=>Math.abs(i-cur)<=3);
  }else{
    els.forEach((p,j)=>{p.style.zIndex=els.length-j;p.classList.toggle('gone',j<cur);p.classList.toggle('far',j<cur-1||j>cur+1)});
    if(flipIdx!=null)els[flipIdx].classList.remove('far');
    book.style.transform='';
    hydrate(els,j=>Math.abs(j-cur)<=4);
  }
  if(instant){book.offsetHeight;els.forEach(e=>e.style.transition='');}
  const onToc=mode==='spread'?cur===1:cur===2;
  book.querySelectorAll('.toc.tight').forEach(el=>{el.classList.remove('play');if(onToc){void el.offsetWidth;el.classList.add('play')}});
  const pg=document.getElementById('pg');
  if(mode==='spread'){const nl=els.length;pg.textContent=cur===0?`1 / ${pages.length}`:cur===nl?`${pages.length} / ${pages.length}`:`${2*cur}–${2*cur+1} / ${pages.length}`}
  else pg.textContent=`${cur+1} / ${pages.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===maxPos();
}
function hydrate(els,near){els.forEach((e,i)=>{if(near(i))e.querySelectorAll('img[data-src]').forEach(im=>{im.src=im.dataset.src;im.removeAttribute('data-src')})})}
function step(d){
  if(busy)return;const t=cur+d;if(t<0||t>maxPos())return;
  busy=true;
  const flip=mode==='spread'?(d>0?cur:cur-1):(d>0?cur:cur-1);
  cur=t;layout(false,flip);
  setTimeout(()=>{busy=false;layout(false)},mode==='spread'?920:720);
}
function next(){step(1)}function prev(){step(-1)}
function jump(t){if(busy)return;cur=Math.max(0,Math.min(maxPos(),t));layout(true)}

function size(){
  const W=window.innerWidth,H=window.innerHeight-56;
  const m=W/H>1.05&&W>700?'spread':'single';
  let pw,ph;
  if(m==='spread'){ph=Math.min(H*.9,(W*.94)/2/.75);pw=ph*.75}
  else{pw=Math.min(W*.92,H*.9*.75);ph=pw/.75}
  document.documentElement.style.setProperty('--pw',pw+'px');
  document.documentElement.style.setProperty('--ph',ph+'px');
  if(m!==mode){
    let lookAt=null;
    if(mode){ // keep roughly the same look when switching
      const i=mode==='spread'?Math.floor((2*cur-4)/4)+1:Math.floor((cur-3)/3)+1;
      if(i>=1&&i<=N)lookAt=i;
    }
    mode=m;pages=buildPages(m);cur=lookAt?lookStart(lookAt):0;render();
  }else layout(true);
}
book.addEventListener('click',e=>{if(e.target.closest('[data-go]'))return;const r=book.getBoundingClientRect();(e.clientX<r.left+r.width/2?prev:next)()});
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)(dx<0?next:prev)();tx=null});
addEventListener('resize',size);
size();
</script>
<script src="../music.js"></script>
</body>
